databases:
  - name: launchrank-db
    databaseName: launchrank
    user: launchrank
    plan: basic

services:
  - type: web
    name: launchrank-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: launchrank-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: launchrank-web
    runtime: static
    buildCommand: npm ci && npm run build --workspace client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://launchrank-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
